document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"214af3a3-1daf-4770-b177-c866ca225c76\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>/* ==========================================================================\n   PRESS — Colour tokens\n   \"Four colours, full stop\" (master deck): Ink · Signal Yellow · White · Card.\n   Everything else is a tint/step of these or a strictly-scoped accent.\n   ========================================================================== */\n\n:root {\n  /* --- Core 1 · Ink — default dark ground + primary text on light --- */\n  --ada-ink-900: #0e0e0e; /* Ink — the canonical near-black canvas */\n  --ada-ink-850: #141414;\n  --ada-ink-800: #181818;\n  --ada-ink-700: #242424; /* card / panel line on dark */\n  --ada-ink-600: #2e2e2e;\n  --ada-ink-500: #3a3a3a;\n\n  /* --- Core 2 · Signal Yellow — the one accent, used with intent --- */\n  --ada-gold-200: #fbe9a6; /* pale gold wash */\n  --ada-gold-300: #f8d660;\n  --ada-gold-400: #f5c518; /* Signal Yellow — THE brand accent */\n  --ada-gold-500: #e0b400; /* amber step */\n  --ada-gold-600: #c9a21a; /* deep gold (numbers / hairlines) */\n  --ada-gold-700: #9a7605;\n\n  /* --- Core 3 · White --- */\n  --ada-white: #ffffff;\n\n  /* --- Core 4 · Card — panels & containers on any ground --- */\n  --ada-card: #f4f4f2; /* Card — the only panel fill */\n  --ada-paper: #f4f4f2; /* alias: light reading ground */\n  --ada-paper-warm: #f7f4ee; /* hero warm white (reading variant only) */\n\n  /* --- Neutral scale — text & lines (deck-sampled, near-neutral) --- */\n  --ada-gray-100: #ececea;\n  --ada-gray-150: #dcdcda; /* primary text on dark slides */\n  --ada-gray-200: #c8c8c8;\n  --ada-gray-300: #b4b4b4;\n  --ada-gray-400: #9a9a9a;\n  --ada-gray-500: #7e7e7e;\n  --ada-gray-600: #6e6e6e; /* muted / caption text */\n  --ada-gray-700: #363636;\n  --ada-gray-800: #202020;\n\n  /* --- Celebration accents — INTERNAL / CULTURE slides only ---------------\n     Never on external decks. Also serve as the categorical data-viz palette. */\n  --ada-accent-coral: #f2664a;\n  --ada-accent-teal: #1fa89a;\n  --ada-accent-sky: #4fa7da;\n  --ada-accent-plum: #8a63a8;\n\n  /* --- Status / semantic colours (functional UI only) --- */\n  --ada-success: var(--ada-accent-teal);\n  --ada-warning: var(--ada-gold-500);\n  --ada-danger: var(--ada-accent-coral);\n  --ada-info: var(--ada-accent-sky);\n\n  /* --- LEGACY / non-canonical -------------------------------------------\n     Kept only so older artifacts & the `orange` Badge variant keep building.\n     NOT part of the brand — do not reach for these in new work. --- */\n  --ada-orange-400: #ff9911; /* deprecated */\n  --ada-orange-500: #ff671f; /* deprecated */\n  --ada-saffron: #d9a441; /* deprecated — \"four colours, full stop\" */\n  --ada-navy: #1e3a5f; /* deprecated */\n  --ada-sand: #ede6d8; /* deprecated */\n\n  /* ======================================================================\n     SEMANTIC COLOUR TOKENS — theme-aware (DARK is the default)\n     Override under [data-ada-theme=\"light\"] for the reading variant.\n     ====================================================================== */\n  --ada-bg: var(--ada-ink-900); /* Ink #0E0E0E */\n  --ada-surface: var(--ada-ink-800);\n  --ada-surface-raised: var(--ada-ink-700);\n  --ada-text: var(--ada-gray-150); /* #DCDCDA — primary text on dark */\n  --ada-text-muted: var(--ada-gray-300); /* #B4B4B4 */\n  --ada-text-subtle: var(--ada-gray-600); /* #6E6E6E — captions */\n  --ada-line: var(--ada-ink-700); /* #242424 hairline on dark */\n  --ada-line-strong: var(--ada-gray-700);\n  --ada-accent: var(--ada-gold-400); /* Signal Yellow fills (buttons, chips) */\n  --ada-accent-strong: var(--ada-gold-300);\n  --ada-accent-text: var(--ada-gold-400); /* gold text — deepens in light mode */\n  --ada-accent-ink: #0e0e0e; /* Ink text on a Signal Yellow fill */\n  --ada-field-bg: rgba(255, 255, 255, 0.04);\n}\n\n/* ==========================================================================\n   LIGHT \"PAPER\" READING VARIANT — theme scope\n   Set data-ada-theme=\"light\" on a surface (ThemeCanvas mode=\"light\" does this)\n   to remap the semantic tokens to the warm-white reading ground. Only the\n   semantic aliases change. The .ada-root--light class is also applied by\n   ThemeCanvas for back-compat.\n   ========================================================================== */\n[data-ada-theme=\"light\"] {\n  --ada-bg: var(--ada-paper-warm);\n  --ada-surface: var(--ada-white);\n  --ada-surface-raised: var(--ada-white);\n  --ada-text: var(--ada-ink-900);\n  --ada-text-muted: var(--ada-gray-600);\n  --ada-text-subtle: var(--ada-gray-500);\n  --ada-line: var(--ada-gray-200);\n  --ada-line-strong: var(--ada-gray-300);\n  --ada-accent-text: var(--ada-gold-700);\n  --ada-field-bg: var(--ada-gray-100);\n  --ada-shadow-soft: 0 10px 40px rgba(14, 17, 22, 0.1);\n  --ada-shadow-2: 0 6px 20px rgba(14, 17, 22, 0.08);\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   PRESS — Type tokens\n   TWO fonts, full stop. Aptos Display for headlines / titles / big numbers,\n   Aptos for body / labels / captions / charts. Aptos is a Microsoft system\n   font with no free webfont, so the stacks fall back to the closest system\n   humanist grotesque (Segoe UI / system-ui / Arial).\n   ========================================================================== */\n\n:root {\n  --ada-font-display: \"Aptos Display\", \"Aptos\", \"Segoe UI\", system-ui,\n    \"Helvetica Neue\", Arial, sans-serif;\n  --ada-font-body: \"Aptos\", \"Segoe UI\", system-ui, \"Helvetica Neue\", Arial,\n    sans-serif;\n  --ada-font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* Type scale (from the master deck's Typography slide) */\n  --ada-type-title: clamp(30px, 4vw, 52px); /* Title · Display Bold */\n  --ada-type-section: clamp(20px, 2vw, 24px); /* Section header · Display Bold */\n  --ada-type-body: 16px; /* Body · 12–16pt Aptos */\n  --ada-type-caption: 11px; /* Caption / footer · 8–11pt Aptos */\n\n  --ada-ls-tight: -0.02em;\n  --ada-ls-eyebrow: 0.18em;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   PRESS — Spacing & radii tokens (4px base)\n   ========================================================================== */\n\n:root {\n  --ada-space-1: 4px;\n  --ada-space-2: 8px;\n  --ada-space-3: 12px;\n  --ada-space-4: 16px;\n  --ada-space-5: 24px;\n  --ada-space-6: 32px;\n  --ada-space-7: 48px;\n  --ada-space-8: 64px;\n\n  --ada-radius-sm: 6px;\n  --ada-radius-md: 10px;\n  --ada-radius-lg: 16px;\n  --ada-radius-xl: 24px;\n  --ada-radius-pill: 999px;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   PRESS — Elevation (warm-black shadows) & motion tokens\n   Motion is subtle and deferential — 140ms hovers, scale(0.98) press,\n   ~400ms fade-ups. No bounces or springs. This is justice tech.\n   ========================================================================== */\n\n:root {\n  --ada-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);\n  --ada-shadow-2: 0 6px 20px rgba(0, 0, 0, 0.35);\n  --ada-shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.45);\n  --ada-shadow-3: 0 20px 60px rgba(0, 0, 0, 0.5);\n  --ada-shadow-glow: 0 0 0 1px rgba(245, 197, 24, 0.35),\n    0 8px 30px rgba(245, 197, 24, 0.12);\n\n  --ada-ease-standard: cubic-bezier(0.2, 0.7, 0.2, 1); /* @kind other */\n  --ada-ease-emphasis: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ada-dur-fast: 140ms; /* @kind other */\n  --ada-dur-base: 240ms; /* @kind other */\n  --ada-dur-slow: 420ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#060606; -webkit-font-smoothing:antialiased; }\n  @keyframes meshPulse {
